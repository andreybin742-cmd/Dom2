<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 Млечный Путь 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* Управление */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            min-width: 50px;
        }
        .controls button:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }
        .controls button.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            color: #ffd700;
        }
        .controls .zoom-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .controls .zoom-group button {
            font-size: 18px;
            padding: 8px 14px;
            min-width: 40px;
        }
        .controls .hint {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            display: flex;
            align-items: center;
            padding: 0 5px;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            .controls {
                bottom: 15px;
                padding: 10px 14px;
                gap: 10px;
                border-radius: 20px;
                flex-wrap: wrap;
                width: 95%;
                max-width: 400px;
            }
            .controls button {
                font-size: 12px;
                padding: 6px 12px;
                min-width: 40px;
            }
            .controls .zoom-group button {
                font-size: 16px;
                padding: 6px 10px;
                min-width: 35px;
            }
            .controls .hint {
                font-size: 9px;
            }
            .info {
                font-size: 10px;
                top: 10px;
                padding: 4px 12px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .controls {
                bottom: 10px;
                padding: 8px 12px;
                gap: 8px;
            }
            .controls button {
                font-size: 11px;
                padding: 4px 10px;
            }
            .info {
                top: 8px;
                font-size: 9px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="info">🌌 Млечный Путь • Тащи для вращения</div>
    
    <div class="controls">
        <button id="pauseBtn" class="active">⏸️ Пауза</button>
        
        <div class="zoom-group">
            <button id="zoomOut">➖</button>
            <span style="color:rgba(255,255,255,0.5);font-size:12px;min-width:30px;text-align:center;" id="zoomLevel">1.0</span>
            <button id="zoomIn">➕</button>
            <button id="resetBtn" style="font-size:16px;padding:6px 12px;">⟲</button>
        </div>
        
        <span class="hint">👆 Тащи</span>
    </div>

    <script>
        // ============================================================
        //  🌌 МЛЕЧНЫЙ ПУТЬ 3D
        // ============================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let W, H, cx, cy;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
        }
        resize();
        window.addEventListener('resize', resize);

        // ============================================================
        //  УПРАВЛЕНИЕ
        // ============================================================
        let rotX = 0.5;
        let rotY = 0.3;
        let targetRotX = rotX;
        let targetRotY = rotY;
        let zoom = 1.0;
        let targetZoom = 1.0;
        let isPaused = false;
        let isDragging = false;
        let lastX = 0, lastY = 0;

        const pauseBtn = document.getElementById('pauseBtn');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const resetBtn = document.getElementById('resetBtn');
        const zoomLevel = document.getElementById('zoomLevel');

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶️ Играть' : '⏸️ Пауза';
            pauseBtn.classList.toggle('active');
        });

        zoomInBtn.addEventListener('click', () => {
            targetZoom = Math.min(2.5, targetZoom + 0.15);
            updateZoom();
        });

        zoomOutBtn.addEventListener('click', () => {
            targetZoom = Math.max(0.3, targetZoom - 0.15);
            updateZoom();
        });

        resetBtn.addEventListener('click', () => {
            targetRotX = 0.5;
            targetRotY = 0.3;
            targetZoom = 1.0;
            updateZoom();
        });

        function updateZoom() {
            zoomLevel.textContent = targetZoom.toFixed(1);
        }

        // Управление пальцем/мышью
        function onStart(x, y) {
            isDragging = true;
            lastX = x;
            lastY = y;
        }

        function onMove(x, y) {
            if (!isDragging) return;
            const dx = x - lastX;
            const dy = y - lastY;
            targetRotY += dx * 0.006;
            targetRotX += dy * 0.006;
            targetRotX = Math.max(-1.8, Math.min(1.8, targetRotX));
            lastX = x;
            lastY = y;
        }

        function onEnd() {
            isDragging = false;
        }

        let lastPinchDist = 0;

        function getPinchDist(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                onStart(e.touches[0].clientX, e.touches[0].clientY);
            } else if (e.touches.length === 2) {
                lastPinchDist = getPinchDist(e.touches);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            } else if (e.touches.length === 2) {
                const dist = getPinchDist(e.touches);
                const delta = dist - lastPinchDist;
                targetZoom = Math.max(0.3, Math.min(2.5, targetZoom + delta * 0.01));
                updateZoom();
                lastPinchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) lastPinchDist = 0;
            if (e.touches.length === 0) onEnd();
        });
        canvas.addEventListener('touchcancel', onEnd);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.05 : 0.05;
            targetZoom = Math.max(0.3, Math.min(2.5, targetZoom + delta));
            updateZoom();
        }, { passive: false });

        // ============================================================
        //  3D МАТЕМАТИКА
        // ============================================================
        function rotate3D(x, y, z, rx, ry) {
            const cosX = Math.cos(rx);
            const sinX = Math.sin(rx);
            let y1 = y * cosX - z * sinX;
            let z1 = y * sinX + z * cosX;
            
            const cosY = Math.cos(ry);
            const sinY = Math.sin(ry);
            let x1 = x * cosY + z1 * sinY;
            let z2 = -x * sinY + z1 * cosY;
            
            return { x: x1, y: y1, z: z2 };
        }

        function project(x, y, z, scale) {
            const dist = 7;
            const fov = 350;
            const factor = fov / (dist + z);
            return {
                sx: cx + x * scale * factor,
                sy: cy + y * scale * factor,
                z: z,
                factor: factor
            };
        }

        // ============================================================
        //  СОЗДАНИЕ ГАЛАКТИКИ
        // ============================================================
        function createGalaxy() {
            const stars = [];
            const numStars = 4000;
            const arms = 4;
            const armSpread = 0.4;
            const radius = 8;
            
            for (let i = 0; i < numStars; i++) {
                const arm = Math.floor(Math.random() * arms);
                const angleOffset = (arm / arms) * Math.PI * 2;
                const dist = Math.pow(Math.random(), 0.6) * radius;
                const angle = dist * 0.8 + angleOffset + (Math.random() - 0.5) * armSpread * (1 + dist * 0.1);
                
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const y = (Math.random() - 0.5) * 0.3 * (1 + dist * 0.1);
                
                const brightness = 0.3 + 0.7 * (1 - dist / radius);
                const size = 0.5 + Math.random() * 2.5 * brightness;
                const color = Math.random() > 0.7 ? '#ffd700' : 
                             Math.random() > 0.5 ? '#ffffff' : 
                             '#88ccff';
                const opacity = 0.3 + 0.7 * brightness * (0.5 + Math.random() * 0.5);
                
                stars.push({ x, y, z, size, color, opacity, brightness });
            }
            
            for (let i = 0; i < 800; i++) {
                const dist = Math.pow(Math.random(), 0.8) * 1.2;
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const y = (Math.random() - 0.5) * 0.2;
                const size = 1 + Math.random() * 3;
                const brightness = 0.6 + 0.4 * (1 - dist / 1.2);
                stars.push({
                    x, y, z, size,
                    color: Math.random() > 0.5 ? '#ffdd77' : '#ffaa44',
                    opacity: 0.5 + 0.5 * brightness,
                    brightness: 1
                });
            }
            
            return stars;
        }

        const galaxy = createGalaxy();

        // ============================================================
        //  ПЛАНЕТЫ
        // ============================================================
        function createPlanets() {
            const planets = [];
            const data = [
                { name: 'Меркурий', size: 0.15, dist: 1.2, color: '#b0a8a0', speed: 2.0 },
                { name: 'Венера', size: 0.25, dist: 1.8, color: '#e8cda0', speed: 1.5 },
                { name: 'Земля', size: 0.28, dist: 2.5, color: '#4488ff', speed: 1.2 },
                { name: 'Марс', size: 0.22, dist: 3.3, color: '#e07040', speed: 1.0 },
                { name: 'Юпитер', size: 0.6, dist: 4.8, color: '#d4a06a', speed: 0.6 },
                { name: 'Сатурн', size: 0.5, dist: 6.5, color: '#e8d090', speed: 0.45, hasRing: true },
                { name: 'Уран', size: 0.4, dist: 8.2, color: '#88ccdd', speed: 0.3 },
                { name: 'Нептун', size: 0.38, dist: 9.8, color: '#4466aa', speed: 0.2 }
            ];
            
            for (const p of data) {
                const angle = Math.random() * Math.PI * 2;
                planets.push({
                    ...p,
                    angle: angle,
                    orbitTilt: (Math.random() - 0.5) * 0.3,
                    yOffset: (Math.random() - 0.5) * 0.5,
                    orbitSpeed: p.speed * 0.3
                });
            }
            return planets;
        }

        const planets = createPlanets();

        // ============================================================
        //  ТУМАННОСТИ
        // ============================================================
        function createNebulae() {
            const nebulae = [];
            const colors = ['#ff446688', '#4488ff66', '#ff66aa44', '#66ffaa44', '#aa66ff44'];
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 6 + Math.random() * 8;
                nebulae.push({
                    x: Math.cos(angle) * dist,
                    z: Math.sin(angle) * dist,
                    y: (Math.random() - 0.5) * 2,
                    size: 2 + Math.random() * 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    opacity: 0.02 + Math.random() * 0.03
                });
            }
            return nebulae;
        }

        const nebulae = createNebulae();

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        let time = 0;

        function draw() {
            time += 0.008;
            
            rotX += (targetRotX - rotX) * 0.06;
            rotY += (targetRotY - rotY) * 0.06;
            zoom += (targetZoom - zoom) * 0.08;

            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
            grad.addColorStop(0, '#0a0a2a');
            grad.addColorStop(0.5, '#050515');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const scale = Math.min(W, H) * 0.035 * zoom;
            const rotYmain = isPaused ? rotY : rotY + time * 0.008;
            const rotXmain = isPaused ? rotX : rotX + time * 0.004;

            // Туманности
            for (const n of nebulae) {
                const r = rotate3D(n.x, n.y, n.z, rotXmain * 0.2, rotYmain * 0.2);
                const proj = project(r.x, r.y, r.z, scale * 0.5);
                if (proj.z > -3) {
                    const size = n.size * (0.8 + 0.2 * Math.sin(time + n.x));
                    const alpha = n.opacity * (1 - Math.abs(proj.z) / 15);
                    const grad2 = ctx.createRadialGradient(
                        proj.sx, proj.sy, 0,
                        proj.sx, proj.sy, size * 30 * scale
                    );
                    grad2.addColorStop(0, n.color.replace('66', Math.floor(alpha * 80).toString(16).padStart(2, '0')));
                    grad2.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad2;
                    ctx.fillRect(proj.sx - size * 40 * scale, proj.sy - size * 40 * scale, size * 80 * scale, size * 80 * scale);
                }
            }

            // Галактика
            const projectedStars = galaxy.map(s => {
                const r = rotate3D(s.x, s.y, s.z, rotXmain, rotYmain);
                const proj = project(r.x, r.y, r.z, scale);
                return { ...proj, size: s.size, color: s.color, opacity: s.opacity };
            });

            projectedStars.sort((a, b) => a.z - b.z);

            for (const s of projectedStars) {
                if (s.z < -4) continue;
                const alpha = s.opacity * (1 - Math.abs(s.z) / 12) * 0.9;
                const size = s.size * (0.5 + 0.5 * (1 + s.z / 10));
                
                if (size > 1.5) {
                    const glowSize = size * 3;
                    const grad2 = ctx.createRadialGradient(s.sx, s.sy, 0, s.sx, s.sy, glowSize);
                    grad2.addColorStop(0, `rgba(255,255,255,${alpha * 0.1})`);
                    grad2.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad2;
                    ctx.fillRect(s.sx - glowSize, s.sy - glowSize, glowSize * 2, glowSize * 2);
                }
                
                ctx.beginPath();
                ctx.arc(s.sx, s.sy, Math.max(0.3, size), 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.min(1, alpha);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Планеты
            for (const p of planets) {
                if (!isPaused) {
                    p.angle += p.orbitSpeed * 0.02;
                }
                
                const x = Math.cos(p.angle) * p.dist;
                const z = Math.sin(p.angle) * p.dist;
                const y = p.yOffset + Math.sin(p.angle * 0.5) * 0.3;
                
                const r = rotate3D(x, y, z, rotXmain, rotYmain);
                const proj = project(r.x, r.y, r.z, scale);
                
                if (proj.z < -3) continue;
                
                const size = p.size * 12 * (0.8 + 0.2 * (1 + proj.z / 8));
                const alpha = 0.7 + 0.3 * (1 - (proj.z + 4) / 10);
                
                const glowSize = size * 3;
                const grad2 = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, glowSize);
                grad2.addColorStop(0, `rgba(255,255,255,${0.05 * alpha})`);
                grad2.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad2;
                ctx.fillRect(proj.sx - glowSize, proj.sy - glowSize, glowSize * 2, glowSize * 2);
                
                const grad3 = ctx.createRadialGradient(
                    proj.sx - size * 0.3, proj.sy - size * 0.3, 0,
                    proj.sx, proj.sy, size
                );
                grad3.addColorStop(0, '#ffffff');
                grad3.addColorStop(0.2, p.color);
                grad3.addColorStop(1, p.color);
                ctx.beginPath();
                ctx.arc(proj.sx, proj.sy, size, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.globalAlpha = Math.min(1, alpha);
                ctx.fill();
                ctx.globalAlpha = 1;
                
                if (p.hasRing) {
                    ctx.save();
                    ctx.globalAlpha = 0.4 * alpha;
                    ctx.translate(proj.sx, proj.sy);
                    ctx.scale(1, 0.25);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, size * 1.9, size * 0.6, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(200,180,150,0.5)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, size * 2.3, size * 0.7, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(180,160,130,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                    ctx.globalAlpha = 1;
                }
                
                if (zoom > 1.2) {
                    ctx.fillStyle = `rgba(255,255,255,${0.3 * alpha})`;
                    ctx.font = `${Math.max(8, 10 * zoom * 0.6)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name, proj.sx, proj.sy + size + 14);
                }
            }

            // Ядро галактики
            const coreSize = 50 * scale;
            const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreSize);
            coreGrad.addColorStop(0, `rgba(255,220,150,${0.04 + 0.02 * Math.sin(time * 0.5)})`);
            coreGrad.addColorStop(0.3, `rgba(255,180,100,${0.02})`);
            coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGrad;
            ctx.fillRect(cx - coreSize, cy - coreSize, coreSize * 2, coreSize * 2);

            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.font = '11px Arial';
            ctx.textAlign = 'right';
            ctx.fillText(`⭐ ${galaxy.length} звёзд`, W - 15, H - 70);
            ctx.fillText(`🪐 ${planets.length} планет`, W - 15, H - 52);
            ctx.fillText(`🔭 ${(zoom * 100).toFixed(0)}%`, W - 15, H - 34);

            requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('resize', resize);

        console.log('🌌 Млечный Путь 3D запущен!');
        console.log('🖱️ Тащите для вращения');
        console.log('🔍 Пинч/колёсико для зума');
        console.log('⏸️ Кнопка паузы');
    </script>
</body>
</html>
